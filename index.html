<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Pedidos - Comidas Rápidas</h1>
    </header>

    <main class="contenedor-principal">
        <!-- SECCIÓN 1: MENÚ PARA PEDIR -->
        <section class="panel">
            <h2>1. Seleccionar Productos</h2>
            <div id="grid-productos" class="grid-botones"></div>
        </section>

        <!-- SECCIÓN 2: DETALLE DEL PEDIDO Y FACTURA -->
        <section class="panel">
            <h2>2. Pedido Actual</h2>
            <ul id="lista-pedido"></ul>
            
            <div class="campo-domicilio">
                <label for="costo-domicilio">Coste de Domicilio:</label>
                <select id="costo-domicilio" onchange="actualizarVistaPedido()">
                    <option value="0">Sin Domicilio ($0)</option>
                    <option value="5000">$5.000</option>
                    <option value="6000">$6.000</option>
                    <option value="7000">$7.000</option>
                    <option value="8000">$8.000</option>
                    <option value="9000">$9.000</option>
                    <option value="10000">$10.000</option>
                    <option value="11000">$11.000</option>
                    <option value="12000">$12.000</option>
                    <option value="13000">$13.000</option>
                    <option value="14000">$14.000</option>
                    <option value="15000">$15.000</option>
                </select>
            </div>

            <hr>
            <div class="resumen-totales">
                <p>Subtotal: $<span id="subtotal-pagar">0</span></p>
                <p>Domicilio: $<span id="valor-domicilio">0</span></p>
                <h3>Total a Pagar: $<span id="total-pagar">0</span></h3>
            </div>
            
            <button class="btn-confirmar" onclick="confirmarPedido()">Generar y Guardar Factura</button>
            <button class="btn-cancelar" onclick="limpiarPedido()">Limpiar Pedido</button>
        </section>

        <!-- SECCIÓN 3: CONTROL DE INVENTARIO Y ELIMINACIÓN -->
        <section class="panel">
            <h2>3. Control de Disponibilidad / Eliminar</h2>
            <div id="lista-admin"></div>
        </section>

        <!-- SECCIÓN 4: REGISTRAR NUEVOS PLATOS/BEBIDAS -->
        <section class="panel">
            <h2>4. Agregar Nuevo Producto</h2>
            <form id="form-nuevo-producto" onsubmit="crearProducto(event)">
                <div class="campo">
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" placeholder="Ej: Salchipapa" required>
                </div>
                <div class="campo">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" placeholder="Ej: 15000" min="1" required>
                </div>
                <button type="submit" class="btn-confirmar">Guardar Producto</button>
            </form>
        </section>

        <!-- SECCIÓN 5: HISTORIAL DE FACTURAS GUARDADAS -->
        <section class="panel ancho-completo">
            <h2>5. Historial de Facturas (Guardadas por 30 Días)</h2>
            <button class="btn-cancelar btn-pila" onclick="limpiarFacturasExpiradas()">Limpiar Viejas</button>
            <div id="historial-facturas" class="grid-facturas"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
