<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Pedidos - Comidas Rápidas</h1>
    </header>

    <main class="contenedor-principal">
        <!-- SECCIÓN 1: MENÚ PARA PEDIR -->
        <section class="panel">
            <h2>1. Seleccionar Productos</h2>
            <div id="grid-productos" class="grid-botones"></div>
        </section>

        <!-- SECCIÓN 2: DETALLE DEL PEDIDO Y TOTAL -->
        <section class="panel">
            <h2>2. Pedido Actual</h2>
            <ul id="lista-pedido"></ul>
            <hr>
            <h3>Total: $<span id="total-pagar">0</span></h3>
            <button class="btn-confirmar" onclick="confirmarPedido()">Confirmar y Vender</button>
            <button class="btn-cancelar" onclick="limpiarPedido()">Limpiar Todo</button>
        </section>

        <!-- SECCIÓN 3: CONTROL DE DISPONIBILIDAD (INVENTARIO) -->
        <section class="panel">
            <h2>3. Control de Disponibilidad</h2>
            <div id="lista-admin"></div>
        </section>

        <!-- SECCIÓN 4: REGISTRAR NUEVOS PLATOS/BEBIDAS -->
        <section class="panel">
            <h2>4. Agregar Nuevo Producto</h2>
            <form id="form-nuevo-producto" onsubmit="crearProducto(event)">
                <div class="campo">
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" placeholder="Ej: Salchipapa" required>
                </div>
                <div class="campo">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" placeholder="Ej: 15000" min="1" required>
                </div>
                <button type="submit" class="btn-confirmar">Guardar Producto</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
