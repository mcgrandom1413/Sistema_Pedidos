<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Mi Negocio - Comidas Rápidas</h1>
    </header>

    <main class="contenedor-principal">

        <!-- 1. MENÚ DE PRODUCTOS -->
        <section class="panel">
            <h2>1. Menú de Productos</h2>
            <div id="grid-productos" class="grid-productos"></div>
        </section>

        <!-- 2. PEDIDO ACTUAL Y DOMICILIOS -->
        <section class="panel">
            <h2>2. Pedido Actual</h2>
            <table class="tabla-pedido">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-pedido"></tbody>
            </table>

            <div class="resumen-pedido">
                <div class="campo">
                    <label for="tipo-entrega">Tipo de Entrega:</label>
                    <select id="tipo-entrega" onchange="toggleDomicilio()">
                        <option value="Local">Consumo en Local / Llevar</option>
                        <option value="Domicilio">Domicilio</option>
                    </select>
                </div>

                <div id="seccion-domicilio" class="campos-domicilio" style="display: none;">
                    <div class="campo">
                        <label for="direccion-domicilio">Dirección de entrega:</label>
                        <input type="text" id="direccion-domicilio" placeholder="Ej: Calle 10 #12-34">
                    </div>
                    <div class="campo">
                        <label for="costo-domicilio">Costo de Envío ($):</label>
                        <input type="number" id="costo-domicilio" value="3000" min="0" oninput="actualizarVistaPedido()">
                    </div>
                </div>

                <h3>Total: $<span id="total-pedido">0</span></h3>

                <div class="campo">
                    <label for="metodo-pago">Método de Pago:</label>
                    <select id="metodo-pago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Nequi/Daviplata">Transferencia (Nequi/Daviplata)</option>
                        <option value="Tarjeta">Tarjeta Débito/Crédito</option>
                    </select>
                </div>
                
                <button type="button" class="btn-confirmar" onclick="finalizarVenta()">Cobrar y Generar Factura</button>
            </div>
        </section>

        <!-- 3. HISTORIAL DE FACTURAS -->
        <section class="panel">
            <div class="cabecera-seccion">
                <h2>3. Historial de Facturas</h2>
                <button type="button" class="btn-eliminar" onclick="borrarFacturas()">Borrar Facturas</button>
            </div>

            <table class="tabla-facturas">
                <thead>
                    <tr>
                        <th># Factura</th>
                        <th>Tipo</th>
                        <th>Total</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody id="tabla-facturas"></tbody>
            </table>
        </section>

        <!-- 4. AGREGAR PRODUCTO -->
        <section class="panel">
            <h2>4. Agregar Nuevo Producto</h2>
            <form id="form-nuevo-producto" onsubmit="crearProducto(event)">
                <div class="campo">
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" placeholder="Ej: Salchipapa" required>
                </div>
                <div class="campo">
                    <label for="precio">Precio ($5.000 - $15.000):</label>
                    <input type="number" id="precio" placeholder="Ej: 15000" min="5000" max="15000" required>
                </div>
                <div class="campo">
                    <label for="imagen">URL de la imagen (Opcional):</label>
                    <input type="url" id="imagen" placeholder="https://ejemplo.com/imagen.jpg">
                </div>
                <button type="submit" class="btn-confirmar">Guardar Producto</button>
            </form>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
